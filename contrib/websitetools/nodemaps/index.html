<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektron Net — Node Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --void: #05070d;
    --panel: rgba(10, 18, 34, 0.82);
    --panel-solid: #0b1220;
    --border: #17335c;
    --cyan: #22e7ff;
    --cyan-dim: #0f7d92;
    --magenta: #ff3ec9;
    --lime: #7bff7a;
    --ink: #e9f4ff;
    --dim: #6f89ad;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-data: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  #map { position: absolute; inset: 0; background: var(--void); }

  /* Leaflet dark-map tweaks */
  .leaflet-container { background: var(--void); font-family: var(--font-ui); }
  .leaflet-control-attribution {
    background: rgba(5,7,13,0.7) !important;
    color: var(--dim) !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: var(--cyan) !important; }
  .leaflet-control-zoom a {
    background: var(--panel-solid) !important;
    color: var(--cyan) !important;
    border: 1px solid var(--border) !important;
  }
  .leaflet-control-zoom a:hover { background: #12223e !important; }

  /* Faint animated scanline sweep across the whole viewport */
  .scanline {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 450;
    background: linear-gradient(to bottom, transparent 0%, rgba(34,231,255,0.05) 50%, transparent 100%);
    background-size: 100% 260px;
    animation: sweep 7s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes sweep { from { background-position: 0 -260px; } to { background-position: 0 100vh; } }

  /* Corner HUD brackets */
  .bracket {
    position: absolute; width: 26px; height: 26px;
    border: 2px solid var(--cyan);
    opacity: 0.55;
    pointer-events: none;
    z-index: 460;
  }
  .bracket.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .bracket.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  /* Top HUD bar */
  .hud-top {
    position: absolute; top: 20px; left: 20px; right: 20px;
    z-index: 500;
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: flex-start;
    pointer-events: none;
  }
  .hud-top > * { pointer-events: auto; }

  .brand {
    display: flex; flex-direction: column; gap: 2px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 16px;
    backdrop-filter: blur(6px);
  }
  .brand .title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(34,231,255,0.65), 0 0 20px rgba(34,231,255,0.25);
  }
  .brand .subtitle {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--dim);
  }

  .counter {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 18px;
    backdrop-filter: blur(6px);
  }
  .counter .num {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    text-shadow: 0 0 10px rgba(34,231,255,0.5);
    min-width: 2ch;
  }
  .counter .label {
    display: flex; flex-direction: column; gap: 2px;
  }
  .counter .label .top {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lime);
    display: flex; align-items: center; gap: 6px;
  }
  .counter .label .sub {
    font-size: 10px;
    color: var(--dim);
    font-family: var(--font-data);
  }
  .livedot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 6px var(--lime), 0 0 12px var(--lime);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .connbar {
    margin-left: auto;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    backdrop-filter: blur(6px);
  }
  .connbar input[type="text"] {
    background: #060b16;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-data);
    font-size: 12px;
    padding: 7px 9px;
    min-width: 220px;
  }
  .connbar input[type="text"]:focus { outline: 1px solid var(--cyan); }
  .connbar button {
    background: #060b16;
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 3px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .connbar button:hover { background: #0f1d34; border-color: var(--cyan); }
  .status-chip {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
    font-family: var(--font-data);
  }
  .status-chip.live { color: var(--lime); }
  .status-chip.err { color: var(--magenta); }

  /* Side panel: country breakdown */
  .sidepanel {
    position: absolute; top: 100px; right: 20px; bottom: 20px;
    width: 260px;
    z-index: 500;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidepanel h2 {
    margin: 0;
    padding: 12px 14px 10px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
  }
  .countrylist {
    overflow-y: auto;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .crow {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .crow .flag { font-size: 15px; line-height: 1; }
  .crow .name {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink);
  }
  .crow .count {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    color: var(--cyan);
    font-weight: 600;
    min-width: 2.5ch;
    text-align: right;
  }
  .crow .bar {
    position: absolute; left: 0; bottom: -4px; height: 2px;
    background: linear-gradient(90deg, var(--cyan), transparent);
    opacity: 0.5;
  }
  .crow { position: relative; padding-bottom: 5px; }

  .empty-note {
    padding: 14px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.5;
  }

  /* Custom node marker (Leaflet divIcon) */
  .node-marker { position: relative; width: 1px; height: 1px; }
  .node-marker .core {
    position: absolute; top: -3px; left: -3px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan), 0 0 14px rgba(34,231,255,0.7);
  }
  .node-marker .ring {
    position: absolute; top: -10px; left: -10px;
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--cyan);
    opacity: 0;
    animation: ping 2.6s ease-out infinite;
  }
  @keyframes ping {
    0%   { opacity: 0.65; transform: scale(0.3); }
    80%  { opacity: 0; transform: scale(1.6); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  .leaflet-tooltip.node-tooltip {
    background: var(--panel-solid);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(34,231,255,0.25);
    opacity: 0.98;
    pointer-events: none;
  }
  .leaflet-tooltip.node-tooltip::before { border-top-color: var(--border); }
  .popup-body { font-family: var(--font-data); font-size: 11.5px; line-height: 1.6; }
  .popup-body .p-ip { color: var(--cyan); font-weight: 700; }
  .popup-body .p-flag { font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .scanline { animation: none; opacity: 0.4; }
    .node-marker .ring { animation: none; opacity: 0.3; }
    .livedot { animation: none; }
  }

  @media (max-width: 820px) {
    .sidepanel { left: 20px; right: 20px; width: auto; top: auto; bottom: 20px; height: 34vh; }
    .connbar { width: 100%; }
    .connbar input[type="text"] { min-width: 0; flex: 1 1 auto; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="scanline"></div>
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<div class="hud-top">
  <div class="brand">
    <div class="title">Elektron Net</div>
    <div class="subtitle">Global Node Map</div>
  </div>

  <div class="counter">
    <div class="num" id="nodeCount">&mdash;</div>
    <div class="label">
      <div class="top"><span class="livedot"></span>Online</div>
      <div class="sub" id="knownSub">of &mdash; known</div>
    </div>
  </div>

  <div class="connbar">
    <input type="text" id="apiBase" placeholder="e.g. https://stats.seeder.yourdomain.org (your stats-api URL)" autocomplete="off" spellcheck="false">
    <button id="connectBtn">connect</button>
    <button id="refreshBtn">refresh</button>
    <span class="status-chip" id="statusChip">disconnected</span>
  </div>
</div>

<div class="sidepanel">
  <h2>Nodes by country</h2>
  <div class="countrylist" id="countryList">
    <div class="empty-note">No data yet &mdash; enter the stats API URL above and click connect.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  const POLL_MS = 5 * 60 * 1000; // client refetch cadence; the API itself only
                                  // regenerates its snapshot every ~30 min server-side.

  const $ = (id) => document.getElementById(id);
  const els = {
    apiBase: $("apiBase"), connectBtn: $("connectBtn"), refreshBtn: $("refreshBtn"),
    statusChip: $("statusChip"), nodeCount: $("nodeCount"), knownSub: $("knownSub"),
    countryList: $("countryList"),
  };

  let map, markerLayer;
  let pollTimer = null;

  function initMap() {
    map = L.map("map", {
      zoomControl: false,
      worldCopyJump: true,
      minZoom: 2,
      maxZoom: 8,
    }).setView([20, 10], 2);
    L.control.zoom({ position: "bottomleft" }).addTo(map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 19,
    }).addTo(map);

    markerLayer = L.layerGroup().addTo(map);
  }

  function normalizeBase(v) { return v.trim().replace(/\/+$/, ""); }

  function setStatus(kind, text) {
    els.statusChip.className = "status-chip" + (kind ? " " + kind : "");
    els.statusChip.textContent = text;
  }

  function countryFlag(code) {
    if (!code || code.length !== 2) return "🏳️";
    const A = 0x1F1E6;
    const chars = code.toUpperCase().split("").map((c) => String.fromCodePoint(A + (c.charCodeAt(0) - 65)));
    return chars.join("");
  }

  function animateCount(el, to) {
    const from = parseInt(el.textContent, 10) || 0;
    if (from === to) { el.textContent = String(to); return; }
    const dur = 600, start = performance.now();
    function step(t) {
      const p = Math.min(1, (t - start) / dur);
      const val = Math.round(from + (to - from) * p);
      el.textContent = String(val);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderNodes(data) {
    markerLayer.clearLayers();

    const nodes = Array.isArray(data.nodes) ? data.nodes : [];
    for (const n of nodes) {
      if (typeof n.lat !== "number" || typeof n.lon !== "number") continue;
      const icon = L.divIcon({
        className: "",
        html: '<div class="node-marker"><span class="ring"></span><span class="core"></span></div>',
        iconSize: [1, 1],
      });
      const marker = L.marker([n.lat, n.lon], { icon });
      const flag = countryFlag(n.countryCode);
      const extra = [];
      if (n.subver) extra.push(escapeHtml(n.subver));
      if (typeof n.startHeight === "number") extra.push(`height ${n.startHeight}`);
      if (typeof n.depth === "number") extra.push(`${n.depth} hop${n.depth === 1 ? "" : "s"} from seed`);

      marker.bindTooltip(
        '<div class="popup-body">' +
        `<div class="p-ip">${escapeHtml(n.ip)}</div>` +
        `<span class="p-flag">${flag}</span> ${escapeHtml(n.country || "Unknown")}<br>` +
        (extra.length ? extra.join(" &middot; ") + "<br>" : "") +
        `first seen: ${formatSeen(n.firstSeen)}<br>` +
        `last seen: ${formatSeen(n.lastSeen)}` +
        "</div>",
        { className: "node-tooltip", direction: "top", offset: [0, -8], sticky: true }
      );
      marker.addTo(markerLayer);
    }

    animateCount(els.nodeCount, data.onlineCount ?? nodes.length);
    els.knownSub.textContent = `of ${data.totalKnown ?? "—"} known`;

    renderCountries(Array.isArray(data.countries) ? data.countries : []);
  }

  function renderCountries(countries) {
    if (!countries.length) {
      els.countryList.innerHTML = '<div class="empty-note">No geolocated nodes yet.</div>';
      return;
    }
    const max = Math.max(...countries.map((c) => c.count));
    els.countryList.innerHTML = countries.map((c) => {
      const pct = Math.max(6, Math.round((c.count / max) * 100));
      return `<div class="crow">
        <span class="flag">${countryFlag(c.code)}</span>
        <span class="name">${escapeHtml(c.name || c.code)}</span>
        <span class="count">${c.count}</span>
        <span class="bar" style="width:${pct}%"></span>
      </div>`;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatSeen(unixSeconds) {
    if (typeof unixSeconds !== "number") return "-";
    return new Date(unixSeconds * 1000).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
  }

  async function refresh() {
    const base = normalizeBase(els.apiBase.value);
    if (!base) return;
    try {
      const res = await fetch(base, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderNodes(data);
      setStatus("live", `live · updated ${new Date(data.generatedAt || Date.now()).toLocaleTimeString("de-DE")}`);
    } catch (e) {
      setStatus("err", `error: ${e.message}`);
    }
  }

  function start() {
    const base = normalizeBase(els.apiBase.value);
    if (!base) { setStatus("err", "enter an API URL"); return; }
    localStorage.setItem("elektron_seeder_stats_base", base);
    if (pollTimer) clearInterval(pollTimer);
    setStatus("", "connecting…");
    refresh();
    pollTimer = setInterval(refresh, POLL_MS);
  }

  els.connectBtn.addEventListener("click", start);
  els.refreshBtn.addEventListener("click", refresh);
  els.apiBase.addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

  initMap();

  // Only ever pre-fill with a previously saved, real URL -- never a made-up
  // example, so this field can't be mistaken for a working default.
  const saved = localStorage.getItem("elektron_seeder_stats_base");
  if (saved) {
    els.apiBase.value = saved;
    start();
  }
})();
</script>
</body>
</html>
