# .github/workflows/build.yaml
name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Abhängigkeiten ────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils curl git \
            g++-mingw-w64-x86-64 \
            nsis \
            python3 \
            cmake ninja-build

          # POSIX-Modus für mingw setzen (wichtig!)
          sudo update-alternatives --set \
            x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set \
            x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

      # ── Version aus CMakeLists.txt auslesen ───────────────────────
      - name: Extract version
        id: version
        run: |
          MAJOR=$(grep -m1 'set(CLIENT_VERSION_MAJOR' CMakeLists.txt | grep -o '[0-9]*')
          MINOR=$(grep -m1 'set(CLIENT_VERSION_MINOR' CMakeLists.txt | grep -o '[0-9]*')
          BUILD=$(grep -m1 'set(CLIENT_VERSION_BUILD' CMakeLists.txt | grep -o '[0-9]*')
          RC=$(grep -m1 'set(CLIENT_VERSION_RC' CMakeLists.txt | grep -o '[0-9]*')
          IS_RELEASE=$(grep -m1 'set(CLIENT_VERSION_IS_RELEASE' CMakeLists.txt | grep -o 'true\|false')
          if [ "$IS_RELEASE" = "false" ] && [ "$RC" != "0" ]; then
            VERSION="v${MAJOR}.${MINOR}.${BUILD}-rc${RC}"
          else
            VERSION="v${MAJOR}.${MINOR}.${BUILD}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Elektron Net ${VERSION}"

      # ── depends system (cross-compile toolchain) ──────────────────
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-win64-${{ hashFiles('depends/**') }}
          restore-keys: depends-win64-

      - name: Fix depends script permissions
        run: |
          cd depends
          chmod +x config.guess config.sub gen_id
          # Falls weitere Hilfsskripte ohne +x committet wurden:
          find . -maxdepth 2 -type f \( -name 'config.guess' -o -name 'config.sub' -o -name 'gen_id' \) -exec chmod +x {} +

      - name: Build depends
        run: |
          cd depends
          make HOST=x86_64-w64-mingw32 -j$(nproc) NO_QT=1

      # ── Elektron Net kompilieren ───────────────────────────────────
      - name: Configure (CMake)
        run: |
          cmake -B build \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=OFF \
            -DENABLE_WALLET=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j$(nproc) --config Release

      # ── Installer-Verzeichnis vorbereiten ─────────────────────────
      - name: Prepare installer staging
        run: |
          cmake --install build \
            --prefix staging \
            --strip

      # ── NSIS Installer erstellen  ──────────────────────────────────
      - name: Build NSIS installer
        run: |
          cmake --build build --target deploy

      # ── Installer umbenennen ──────────────────────────────────────
      - name: Rename installer
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SETUP=$(find build -name "*setup*.exe" | head -1)
          if [ -n "$SETUP" ]; then
            DIR=$(dirname "$SETUP")
            mv "$SETUP" "$DIR/elektron-net-windows-${VERSION}_setup.exe"
            echo "Renamed to: elektron-net-windows-${VERSION}_setup.exe"
          else
            echo "No setup.exe found – checking build output:"
            find build -name "*.exe"
          fi

      # ── Artefakte hochladen ───────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: elektron-net-windows-${{ steps.version.outputs.version }}_setup
          path: |
            build/**/elektron-net-windows-*_setup.exe
            build/**/*.zip
          if-no-files-found: warn

      # ── Release-Asset anhängen (nur bei Tag) ─────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Elektron Net ${{ steps.version.outputs.version }}"
          prerelease: ${{ contains(steps.version.outputs.version, '-rc') }}
          files: |
            build/**/elektron-net-windows-*_setup.exe
            staging/bin/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
