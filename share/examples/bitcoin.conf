# ============================================
# Elektron Net Configuration File
# ============================================
# This file is automatically generated on first launch.
# Uncomment lines and modify values as needed.

# --------------------------------------------
# Network (P2P)
# --------------------------------------------

# Master seed node — used once for initial peer discovery (addrfetch).
# seednode=seed0.eleknet.org
seednode=seed0.eleknet.org

# Manually add a permanent node the first know nodes.
addnode=kutlusoy.duckdns.org:8333
addnode=188.20.182.78:8333

# Accept incoming P2P connections (required for a public node).
listen=1

# Maximum number of inbound/outbound connections (default: 125).
# maxconnections=125

# Bind to a specific address/interface (default: all interfaces).
# bind=0.0.0.0

# Connect only to the specified nodes (disables automatic peer discovery).
# connect=188.20.182.78:8333

# Whitelist a peer to bypass rate limits and DoS scoring (use for trusted nodes).
# whitelist=192.168.1.100

# --------------------------------------------
# RPC Server
# --------------------------------------------

# Enable RPC server.
server=1

# RPC username and password for authentication.
# WARNING: Use a strong, unique password in production.
rpcuser=elek
rpcpassword=pass

# Bind RPC to localhost only (strongly recommended for security).
rpcbind=127.0.0.1

# Allow RPC connections only from localhost.
rpcallowip=127.0.0.1

# RPC port (default for mainnet: 8332).
# rpcport=8332

# Timeout for RPC requests in seconds (default: 30).
# rpcservertimeout=30

# Disable RPC cookie authentication (not recommended).
# rpccookiefile=0

# --------------------------------------------
# Wallet
# --------------------------------------------

# Disable the wallet component entirely.
# disablewallet=1

# Automatically load all wallets in the <datadir>/wallets directory.
# autoloadwallet=1

# Load a specific wallet on startup (path relative to wallets dir).
# wallet=mywallet

# Transaction fee rate in Elek/kB (default: automatic).
# paytxfee=0.0001

# Allow spending unconfirmed change outputs.
# spendzeroconfchange=1

# --------------------------------------------
# Mining / Staking
# --------------------------------------------

# Generate blocks (solo mining) when RPC getnewblock / generatetoaddress is called.
# Only useful on regtest or if you have significant hashrate.
# generatetoaddress=1

# Coinbase reward destination address.
# coinbasereceiver=be1q...

# --------------------------------------------
# Pruning (MANDATORY on Elektron Net)
# --------------------------------------------

# Elektron Net enforces mandatory 137-day pruning (197,280 blocks at 60s).
# Retention is fixed by protocol — not configurable. Use manual mode:

# prune=1

# --------------------------------------------
# Performance / Memory
# --------------------------------------------

# Database cache size in MiB (default: 450; more = faster sync).
# dbcache=2048

# Number of script verification threads (-1 = auto).
# par=4

# Max memory for the mempool in MiB (default: 300).
# maxmempool=300

# Minimum fee rate to accept into mempool in Elek/kB.
# minrelaytxfee=0.00001

# --------------------------------------------
# Indexes (optional)
# --------------------------------------------

# Build a full transaction index (requires more disk; incompatible with pruning).
# NOT available on Elektron Net because pruning is mandatory.
# txindex=1

# Build a basic block filter index (BIP 157/158).
# blockfilterindex=1

# --------------------------------------------
# Logging / Debug
# --------------------------------------------

# Log level: 0 = error, 1 = info, 2 = debug.
# debug=1

# Log specific categories (net, mempool, rpc, prune, validation, etc.).
# debug=net
# debug=mempool

# Shrink debug.log file on startup.
shrinkdebugfile=1

# Print to console instead of debug.log.
# printtoconsole=1

# --------------------------------------------
# Advanced / Security
# --------------------------------------------

# Run as a daemon (background process) — only for elektrond.
# daemon=1

# Require a minimum number of confirmations before accepting a payment.
# confirmations=6

# Enable experimental ZeroMQ notifications (requires compiled support).
# zmqpubhashtx=tcp://127.0.0.1:28332

# Chain type: main, test, signet, regtest (default: main).
# chain=main

# Data directory path (default: OS-specific).
# datadir=/var/lib/elektron-net

# Configuration file path (default: <datadir>/bitcoin.conf).
# conf=/etc/elektron-net/bitcoin.conf

# Alert notify command — executed when a long fork is detected.
# alertnotify=echo %%s | mail -s 'Elektron Alert' admin@example.com

# Block notify command — executed when a new best block is accepted.
# blocknotify=/usr/local/bin/notify.sh %%s

# Wallet notify command — executed when a wallet transaction is received.
# walletnotify=/usr/local/bin/wallet-notify.sh %%s
